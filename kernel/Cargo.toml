[package]
name = "astral-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
limine = "0.5"
spin = "0.9"
uart_16550 = "0.3"
x86_64 = "0.15"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
embedded-graphics = { version = "0.8", default-features = false }
tinybmp = { version = "0.5", default-features = false }

[dependencies.linked_list_allocator]
version = "0.10"
default-features = false
features = ["use_spin"]
