[package]
name = "astral-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2.4"
spin = "0.9"
x86_64 = "0.15"
limine = "0.5.0"

[build-dependencies]
cc = "1.0"

[features]
default = []
debug_allocator = []
dream_state = []
reality_engine = []

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
lto = true
opt-level = 2
codegen-units = 1
strip="symbols"

[package.metadata.bootimage]
default-target = "x86_64-astral.json"