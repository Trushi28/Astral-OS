# Limine bootloader configuration for Astral OS

# Timeout in seconds (5 seconds)
timeout: 5

# Graphics mode
graphics: yes
resolution: 1024x768

# Menu entry for Astral OS
/Astral OS
    protocol: limine
    kernel_path: boot():/astral-kernel
/Astral OS (root path)
    protocol: limine  
    kernel_path: boot():/astral-kernel