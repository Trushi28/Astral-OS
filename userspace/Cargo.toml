[package]
name = "userspace"
version = "0.1.0"
edition = "2021"

# Keep this crate independent from kernel workspace
[workspace]

[lib]
crate-type = ["staticlib"]

[[bin]]
name = "hello"
path = "src/bin/hello.rs"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[profile.dev]
panic = "abort"
